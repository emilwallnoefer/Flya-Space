<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ebecef">
<title>Flya Space</title>
<!--
  The launch page, served at "/" straight from the CDN (next.config.ts rewrites
  "/" here, and src/proxy.ts leaves "/" alone), so it paints the instant the
  app is opened, before any server function has booted. It shows the same
  wordmark as components/launch-splash.tsx, in the skin cached on this device,
  then moves on to /dashboard; the browser keeps this page on screen until the
  dashboard's first paint, where the app's own splash takes over and resumes
  the wordmark's entrance from the point reached here (data-launch-warm and
  --launch-elapsed, set by the theme bootstrap in app/layout.tsx from the
  stamp launch-boot.js leaves). The entrance keyframes below are therefore a
  copy of launchSplashWord in app/animations.css, same duration and curve.

  Nothing here is personal and nothing is fetched: it reads localStorage for the
  skin and writes one sessionStorage flag. Colours are the page / ink /
  accent-soft tokens of each skin in app/tokens.css, by value: keep them in step.
-->
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="preload" href="/fonts/syncopate-700.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face {
    font-family: "Syncopate";
    font-weight: 700;
    font-display: block;
    src: url("/fonts/syncopate-700.woff2") format("woff2");
  }
  :root {
    --splash-bg: #ebecef;
    --splash-ink: #1f252e;
    --splash-accent: #285458;
    color-scheme: light;
  }
  html[data-theme="light"] { --splash-bg: #fcfaf5; --splash-ink: #586e75; --splash-accent: #8a6500; }
  html[data-theme="light"][data-accent="blue"] { --splash-accent: #35617f; }
  html[data-theme="light"][data-mode="blue"] { --splash-bg: #f7fafd; --splash-ink: #586e75; --splash-accent: #205698; }
  html[data-theme="light"][data-mode="neu"] { --splash-bg: #ebecef; --splash-ink: #1f252e; --splash-accent: #285458; }
  html[data-dark] { --splash-bg: #020617; --splash-ink: #f1f5f9; --splash-accent: #a5f3fc; color-scheme: dark; }
  /* Hand over to the app with a cross-document view transition: the browser
     keeps this page's last frame and crossfades into the app's first frame,
     which is the same wordmark at rest, instead of cutting. Same declaration
     in app/animations.css; a browser without it simply cuts, as before. */
  @view-transition { navigation: auto; }
  ::view-transition-old(root), ::view-transition-new(root) {
    animation-duration: 350ms;
    animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  }
  html, body { height: 100%; margin: 0; }
  /* Same smoothing as the app's body (Tailwind `antialiased`), or the title
     renders a touch heavier here and visibly shifts weight at the hand-over. */
  body {
    background: var(--splash-bg); color: var(--splash-ink);
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  }
  .launch-splash {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 0 16px;
  }
  /* The app's .brand-wordmark (app/animations.css) by hand: this page is a
     plain file and cannot share the stylesheet. Keep the two in step. */
  .launch-splash-word {
    font-family: "Syncopate", "Michroma", "Eurostile", ui-sans-serif, sans-serif;
    text-transform: uppercase; white-space: nowrap;
    font-weight: 700; font-size: clamp(17px, 3.4vw, 56px); line-height: 1;
    letter-spacing: 0.22em; margin-right: -0.22em;
    transform: scaleX(1.28);
    animation: launchSplashWord 900ms cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  /* Transform and opacity only: on the compositor, no layout per frame. */
  @keyframes launchSplashWord {
    from { opacity: 0; transform: scaleX(1.44); }
    45% { opacity: 1; }
    to { opacity: 1; transform: scaleX(1.28); }
  }
  @media (prefers-reduced-motion: reduce) {
    .launch-splash-word { animation: none; }
    @view-transition { navigation: none; }
  }
</style>
<script src="/launch-boot.js"></script>
<noscript><meta http-equiv="refresh" content="0;url=/dashboard"></noscript>
</head>
<body>
<div class="launch-splash" role="status" aria-label="Flya Space is loading">
  <div class="launch-splash-word">The Flya Space</div>
</div>
</body>
</html>
