<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Flya Space app icon, source of truth. `scripts/build-app-icons.mjs`
    rasterises it into public/icons/ and src/app/apple-icon.png; edit this
    file, then re-run the script, never the PNGs.

    Neumorphism, the same language as the app's neu skin (tokens.css,
    data-mode="neu"): every surface is the page grey, and depth comes only
    from a soft light (white, top-left) and a soft shade (grey, bottom-right).
    A raised plate holds a pressed-in well; the mark sits in the well in
    charcoal ink and the skin's dark teal, so it still reads at 29px where the
    shadows fade. Shadow offsets and blurs are sized for the 512 canvas,
    about five times the skin's 6px, so they survive the downscale.

    Full-bleed square on purpose: every platform applies its own mask (iOS
    rounds the corners, Android uses the separate maskable render), so no
    corner radius is baked in here, and nothing is transparent.
  -->
  <defs>
    <!-- raised: light to the top-left, shade to the bottom-right -->
    <filter id="raised" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-22" dy="-22" stdDeviation="22" flood-color="#ffffff" flood-opacity="0.95"/>
      <feDropShadow dx="22" dy="22" stdDeviation="24" flood-color="#c6cad2" flood-opacity="1"/>
    </filter>
    <!-- pressed: the same pair, cast inward -->
    <clipPath id="well-clip">
      <circle cx="256" cy="256" r="178"/>
    </clipPath>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <!-- The page -->
  <rect width="512" height="512" fill="#ebecef"/>

  <!-- The plate, same colour as the page; only the shadows say it is raised -->
  <rect x="56" y="56" width="400" height="400" rx="96" fill="#ebecef" filter="url(#raised)"/>

  <!-- The well: a disc of the page colour with shade at the top-left and light at the bottom-right, inside -->
  <g clip-path="url(#well-clip)">
    <circle cx="256" cy="256" r="178" fill="#ebecef"/>
    <circle cx="256" cy="256" r="178" fill="none" stroke="#c6cad2" stroke-width="44" transform="translate(-14 -14)" filter="url(#soft)"/>
    <circle cx="256" cy="256" r="178" fill="none" stroke="#ffffff" stroke-width="44" transform="translate(14 14)" filter="url(#soft)"/>
  </g>

  <!-- Everything inside #mark is the glyph; the maskable build scales it
       down around the centre while the background keeps bleeding to the edge. -->
  <g id="mark">
    <!-- The cage: the Elios sphere as its outline and two great circles -->
    <g fill="none" stroke-linecap="round">
      <circle cx="256" cy="256" r="150" stroke="#1f252e" stroke-width="18"/>
      <ellipse cx="256" cy="256" rx="150" ry="56" stroke="#2f5f63" stroke-width="9" opacity="0.9"/>
      <ellipse cx="256" cy="256" rx="56" ry="150" stroke="#2f5f63" stroke-width="9" opacity="0.9" transform="rotate(24 256 256)"/>
    </g>

    <!-- The flight path: an F with rounded joins, and the wake it leaves -->
    <g fill="none" stroke="#1f252e" stroke-linecap="round" stroke-linejoin="round">
      <path d="M212 340 V176 H312" stroke-width="40"/>
      <path d="M212 258 H290" stroke-width="40"/>
      <path d="M176 300 H188" stroke-width="12" opacity="0.7"/>
      <path d="M154 322 H172" stroke-width="12" opacity="0.45"/>
      <path d="M138 344 H160" stroke-width="12" opacity="0.25"/>
    </g>
  </g>
</svg>
