name: Security Baseline

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/**"
  push:
    branches: ["main"]
    paths:
      - "web/**"
      - ".github/workflows/**"
  # Advisories are published against versions we already ship, so the gate can
  # turn red without anyone pushing. Run it daily against main so that shows up
  # as its own failed run instead of on the next unrelated PR.
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

# The job only reads the repo. Without this block the token gets the repo's
# default permissions, which may include write.
permissions:
  contents: read

jobs:
  web-security-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      # Actions are pinned to a commit, not a movable tag; Dependabot's
      # github-actions updates bump the SHA and the comment together.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing later in the job pushes; keep the token out of .git/config.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies (lockfile)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
